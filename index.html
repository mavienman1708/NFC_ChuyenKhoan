<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh Toán NFC</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 20px;
        background: #f5f5f5;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        max-width: 400px;
        margin: auto;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      img {
        width: 100%;
        max-width: 280px;
        border-radius: 8px;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        background: #007bff;
        color: white;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>CHUYỂN TIỀN CHO MÃN MA</h2>

      <!-- Hiển thị mã VietQR tạo tự động -->
      <img id="qrCode" src="" alt="Mã QR Thanh Toán" />

      <br />
      <!-- Nút mở app ngân hàng -->
      <a id="payBtn" href="#" class="btn">Chuyển Tiền Qua App Ngân Hàng</a>
    </div>

    <script>
      // 1. Cấu hình thông tin tài khoản nhận tiền của bạn
      const BANK_ID = "BIDV"; // Mã ngân hàng (VD: VCB, MB, TCB, ACB, VPB...)
      const ACCOUNT_NO = "0938075655"; // Số tài khoản của bạn
      const ACCOUNT_NAME = "MA NGUYEN VIEN MAN"; // Tên chủ tài khoản

      // 2. Tùy chỉnh số tiền & nội dung (Có thể lấy từ URL param nếu làm động)
      const urlParams = new URLSearchParams(window.location.search);
      const amount = urlParams.get("amount") || ""; // Mặc định 50,000 VND
      const memo = urlParams.get("memo") || "Chuyen tien NFC";

      // 3. Tạo Link hình ảnh QR và Link Thanh toán
      const qrImageUrl = `https://img.vietqr.io/image/${BANK_ID}-${ACCOUNT_NO}-compact2.png?amount=${amount}&addInfo=${encodeURIComponent(memo)}&accountName=${encodeURIComponent(ACCOUNT_NAME)}`;

      // Link kích hoạt mở App/Thanh toán VietQR
      const deeplink = `https://dl.vietqr.io/pay?app=${BANK_ID}&ba=${ACCOUNT_NO}@${BANK_ID}&am=${amount}&tn=${encodeURIComponent(memo)}`;

      // 4. Render ra giao diện
      document.getElementById("qrCode").src = qrImageUrl;
      document.getElementById("payBtn").href = deeplink;
    </script>
  </body>
</html>
